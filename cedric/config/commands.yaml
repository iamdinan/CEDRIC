# Cedric Commands Registry (commands.yaml)
# Phase 1 Command Registry with Phase 2 LLM prompt hooks (description, parameters)

- id: youtube
  name: YouTube
  description: "Opens YouTube website in Google Chrome"
  parameters: {}
  aliases: ["youtube", "you tube"]
  type: url
  target: "https://www.youtube.com"
  browser: chrome
  needs_internet: true
  reply: "Opening YouTube."

